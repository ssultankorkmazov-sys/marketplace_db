services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketplace_db
      POSTGRES_USER: marketkz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketkz_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - marketkz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketkz -d marketplace_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  marketkz_postgres_data:
